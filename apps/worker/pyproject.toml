[project]
name = "clipera-worker"
version = "0.1.0"
description = "Clipera video processing worker (FFmpeg pipeline, transcription, AI selection, rendering)"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "boto3>=1.35",
  "yt-dlp[default]>=2026.10.26",
  "deno>=2.9.8",
  "requests>=2.32",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipera_worker"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../supabase/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Consigne destinée à l'IA : texte en prose, lignes longues assumées.
"src/clipera_worker/selection/prompt.py" = ["E501"]
